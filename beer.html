<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beer Counter</title>
  <style>
    body {
      background: #f5b82e;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
      color: #3b2a00;
    }
    h1 { font-size: 2.4em; margin-bottom: 5px; }
    p { max-width: 450px; margin: 10px auto; }
    #count { font-size: 5em; font-weight: bold; margin: 10px 0 0; }
    #count-label { margin-top: 0; }
    form {
      background: #fff3cc;
      border: 2px solid #3b2a00;
      max-width: 350px;
      margin: 25px auto;
      padding: 20px;
    }
    label { display: block; margin: 12px 0 4px; font-weight: bold; }
    input { font-size: 1em; }
    input[type="file"] { width: 100%; font-size: 1em; }
    input[type="file"]::file-selector-button {
      font-size: 1.3em;
      padding: 16px 22px;
      margin-right: 10px;
      background: #3b2a00;
      color: #fff3cc;
      border: none;
      cursor: pointer;
    }
    .number-row {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 6px;
    }
    .number-row input {
      width: 110px;
      font-size: 2.2em;
      text-align: center;
      padding: 8px 0;
    }
    .step {
      font-size: 2.2em;
      width: 70px;
      margin-top: 0;
      padding: 0;
    }
    #submit-btn {
      width: 100%;
      font-size: 1.7em;
      padding: 20px;
    }
    button {
      font-size: 1.1em;
      margin-top: 20px;
      padding: 8px 20px;
      background: #3b2a00;
      color: #fff3cc;
      border: none;
      cursor: pointer;
    }
    #message { font-weight: bold; min-height: 1.5em; }
  </style>
</head>
<body>

  <h1>Beer Counter</h1>
  <p>Count your beers wisely with this WEB-SITE. Upload a number of beers and photographic evidence of said beers. The photographic evidence will be thoroughly analysed to dictate it's veracity, and once it goes through such process, the beer number will increase.</p>

  <div id="count">0</div>
  <p id="count-label">Beers Drunk</p>

  <form id="beer-form">
    <label for="photo">Photographic Evidence</label>
    <input type="file" id="photo" accept="image/*">

    <label for="amount">B-Number</label>
    <div class="number-row">
      <button type="button" class="step" id="minus">-</button>
      <input type="number" id="amount" min="1" value="1" inputmode="numeric">
      <button type="button" class="step" id="plus">+</button>
    </div>

    <button type="submit" id="submit-btn">Submit</button>
  </form>

  <p id="message"></p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
  <script>
    // Paste these two from Supabase (Project Settings > API)
    const SUPABASE_URL = "https://qokecwecsbyxndawytlt.supabase.co";
    const SUPABASE_KEY = "sb_publishable_jiwmjg4m06GYg1Wge5TJhA_m_m2l0jd";
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const form = document.getElementById("beer-form");
    const message = document.getElementById("message");
    const countEl = document.getElementById("count");
    const amountEl = document.getElementById("amount");

    document.getElementById("minus").addEventListener("click", function () {
      amountEl.value = Math.max(1, (parseInt(amountEl.value, 10) || 1) - 1);
    });
    document.getElementById("plus").addEventListener("click", function () {
      amountEl.value = (parseInt(amountEl.value, 10) || 0) + 1;
    });

    async function loadCount() {
      const { data, error } = await db.rpc("get_total");
      if (error) {
        countEl.textContent = "?";
        return;
      }
      countEl.textContent = data;
    }

    form.addEventListener("submit", async function (e) {
      e.preventDefault();

      const photo = document.getElementById("photo").files[0];
      const amount = parseInt(document.getElementById("amount").value, 10);

      if (!photo) {
        message.textContent = "Evidence necessitated";
        return;
      }
      if (!amount || amount < 1) {
        message.textContent = "B-Number must be at least 1.";
        return;
      }

      if (photo.size > 5 * 1024 * 1024) {
        message.textContent = "That picture is too big (max 5 MB).";
        return;
      }

      const button = form.querySelector("button");
      button.disabled = true;
      message.textContent = "Sending...";

      // 1. upload the picture to the private folder
      const ext = (photo.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "");
      const path = crypto.randomUUID() + "." + ext;
      const upload = await db.storage.from("photos").upload(path, photo);

      if (upload.error) {
        message.textContent = "Upload failed. Try harder.";
        button.disabled = false;
        return;
      }

      // 2. save the number as a pending entry
      const insert = await db.from("entries").insert({ amount: amount, photo_path: path });

      if (insert.error) {
        message.textContent = "Something is wrong, I can feel it";
        button.disabled = false;
        return;
      }

      message.textContent = "Beers Sended";
      form.reset();
      button.disabled = false;
    });

    loadCount();
  </script>

</body>
</html>
